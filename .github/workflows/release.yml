name: release

# Release workflow for egl-util-csharp, generated by EADOS.
# Two human-gated stages tied to a SemVer tag (AGENTS.md §11 / docs/workflow/release.md +
# packaging.md):
#   1. On a `v*.*.*` tag push: build + pack the single It.D4np.Util package, assert the packed
#      version equals the tag, and open the GitHub Release as a DRAFT with the .nupkg/.snupkg
#      attached. Nothing is published.
#   2. When a maintainer clicks "Publish" on that draft (the deliberate human checkpoint), the
#      `release: published` event pushes the reviewed package to nuget.org.
# Publishing requires the NUGET_API_KEY repository secret; without it the publish job fails loudly
# rather than silently skipping.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

# Least privilege by default; only the drafting job elevates to write (see per-job permissions).
permissions:
  contents: read

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 1 (on the tag push): pack, verify the version, and draft the release with artifacts.
  pack-and-draft:
    if: github.event_name == 'push'
    name: pack + draft GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # draft the GitHub Release and attach the package assets
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }

      # Only Infrastructure is packable (it bundles Domain + Application); pack it explicitly so the
      # non-packable projects are never packaged separately.
      - name: Pack the single It.D4np.Util package (+ symbols)
        shell: bash
        run: dotnet pack src/main/csharp/it/d4np/util/Infrastructure/It.D4np.Util.Infrastructure.csproj -c Release -o ./artifacts

      - name: Assert the packed version equals the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          nupkg=$(find ./artifacts -name '*.nupkg' | head -1)
          if [ -z "$nupkg" ]; then echo "::error::dotnet pack produced no .nupkg"; exit 1; fi
          pkgver=$(basename "$nupkg" .nupkg | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')
          echo "tag=$tag  packed=$pkgver"
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::tag v$tag does not match the packed package version $pkgver — bump Version.cs and the csproj <Version> to match the tag before releasing"
            exit 1
          fi

      - name: Draft the release with the package attached (a human publishes it)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 (when the maintainer publishes the drafted release): push the reviewed package to NuGet.
  publish-nuget:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    name: publish ${{ github.event.release.tag_name }} to NuGet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read    # only downloads the release assets; never writes to the repo
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }

      # Push the exact artifacts a human reviewed on the release, not a fresh rebuild.
      # The tag is bound to an env var (never templated into the script) and shape-validated, so an
      # untrusted release tag_name cannot inject shell — see ADR-0017.
      - name: Download the reviewed package from the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::unexpected release tag '$TAG_NAME' — expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          mkdir -p ./artifacts
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' --pattern '*.snupkg' --dir ./artifacts
          ls -l ./artifacts

      - name: Push to nuget.org (idempotent; the adjacent .snupkg symbols go with the .nupkg)
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not set — add it under Settings > Secrets and variables > Actions to enable publishing"
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
