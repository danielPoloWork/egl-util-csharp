name: release

# Release workflow for egl-util-csharp, generated by EADOS.
# Two human-gated stages tied to a SemVer tag (AGENTS.md §11 / docs/workflow/release.md +
# packaging.md):
#   1. On a `v*.*.*` tag push: run the full CI suite (build + test matrix, format/analyzers/coverage,
#      consistency lint) on the tagged commit, then pack the single It.D4np.Util package, assert the
#      packed version equals the tag, require the curated docs/releases/<tag>.md notes, and open the
#      GitHub Release as a DRAFT — the curated notes as the body — with the .nupkg/.snupkg attached.
#      Nothing is published.
#   2. When a maintainer clicks "Publish" on that draft (the deliberate human checkpoint), the
#      `release: published` event pushes the reviewed package to nuget.org.
# Publishing requires the NUGET_API_KEY repository secret; without it the publish job fails loudly
# rather than silently skipping.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

# Least privilege by default; only the drafting job elevates to write (see per-job permissions).
permissions:
  contents: read

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 0 (on the tag push): run the FULL CI suite — build + test across the OS matrix,
  # format/analyzers/coverage, and the consistency lint — on the TAGGED commit. A tag push does not
  # trigger ci.yml on its own, so without this gate a tag on a commit with failing tests (or a version
  # mismatch) still drafts a green release (#37). pack-and-draft `needs:` this, so the release is drafted
  # only after every gate passes on exactly the released commit.
  verify:
    if: github.event_name == 'push'
    name: verify (full CI on the tagged commit)
    uses: ./.github/workflows/ci.yml

  # Stage 1 (on the tag push): pack, verify the version, and draft the release with artifacts.
  pack-and-draft:
    if: github.event_name == 'push'
    needs: verify
    name: pack + draft GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # draft the GitHub Release and attach the package assets
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with: { dotnet-version: '8.0.x' }

      # Only Infrastructure is packable (it bundles Domain + Application); pack it explicitly so the
      # non-packable projects are never packaged separately.
      - name: Pack the single It.D4np.Util package (+ symbols)
        shell: bash
        run: dotnet pack src/main/csharp/it/d4np/util/Infrastructure/It.D4np.Util.Infrastructure.csproj -c Release -o ./artifacts

      - name: Assert the packed version equals the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          nupkg=$(find ./artifacts -name '*.nupkg' | head -1)
          if [ -z "$nupkg" ]; then echo "::error::dotnet pack produced no .nupkg"; exit 1; fi
          pkgver=$(basename "$nupkg" .nupkg | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$')
          echo "tag=$tag  packed=$pkgver"
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::tag v$tag does not match the packed package version $pkgver — bump <Version> in Directory.Build.props to match the tag before releasing"
            exit 1
          fi

      # Generate a CycloneDX SBOM for the package and attach it to the release (#47, ADR-0031;
      # docs/workflow/packaging.md calls for provenance/SBOM). Runs the pinned CycloneDX .NET tool over the
      # single packable project — which references Domain + Application — producing a CycloneDX JSON bill of
      # materials of the shipped dependency graph. Under CI (GITHUB_ACTIONS=true) the tool's restore honors
      # RestoreLockedMode, so it reads the committed lockfile.
      - name: Generate a CycloneDX SBOM
        shell: bash
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="$PATH:$HOME/.dotnet/tools"
          version="${GITHUB_REF_NAME#v}"
          dotnet CycloneDX \
            src/main/csharp/it/d4np/util/Infrastructure/It.D4np.Util.Infrastructure.csproj \
            --output ./artifacts --output-format Json \
            --filename "It.D4np.Util.${version}.sbom.json" \
            --set-name It.D4np.Util --set-version "$version"

      # The curated notes under docs/releases/<tag>.md are the reviewed release artifact (docs/workflow/
      # release.md step 4). Require them so a tag cannot be drafted with only GitHub's auto-generated body
      # (#73); the draft step below uses this file as the release body.
      - name: Require the curated release notes for this tag
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::curated release notes '$notes' are missing — write them before tagging (docs/workflow/release.md step 4)"
            exit 1
          fi

      - name: Draft the release with the package attached (a human publishes it)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # Curated notes (docs/releases/<tag>.md) as the body; the auto-generated commit/PR list is
          # appended after them (#73).
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/*.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 (when the maintainer publishes the drafted release): push the reviewed package to NuGet.
  publish-nuget:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    name: publish ${{ github.event.release.tag_name }} to NuGet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read    # only downloads the release assets; never writes to the repo
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with: { dotnet-version: '8.0.x' }

      # Push the exact artifacts a human reviewed on the release, not a fresh rebuild.
      # The tag is bound to an env var (never templated into the script) and shape-validated, so an
      # untrusted release tag_name cannot inject shell — see ADR-0017.
      - name: Download the reviewed package from the published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::unexpected release tag '$TAG_NAME' — expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          mkdir -p ./artifacts
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.nupkg' --pattern '*.snupkg' --dir ./artifacts
          ls -l ./artifacts

      - name: Push to nuget.org (idempotent; the adjacent .snupkg symbols go with the .nupkg)
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::NUGET_API_KEY secret is not set — add it under Settings > Secrets and variables > Actions to enable publishing"
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
