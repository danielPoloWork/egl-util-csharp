name: dependency-review

# Supply-chain gate for egl-util-csharp (#47, ADR-0031). On every pull request it diffs the dependency
# manifest against the base branch and fails if the PR introduces a dependency with a known vulnerability
# (or, once configured, a disallowed license), posting a summary on the PR when it blocks. Complements the
# grouped Dependabot updates (.github/dependabot.yml), which keep dependencies current but do not gate a PR.
# Runs only on pull_request (the action diffs the PR). Requires the repository Dependency Graph and Actions
# billing to be enabled.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post the summary comment when the review blocks the PR
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
