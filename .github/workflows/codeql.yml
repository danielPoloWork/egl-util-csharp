name: codeql

# Static analysis (SAST) for egl-util-csharp (#47, ADR-0031). Runs CodeQL over the C# source on pushes to
# main and on pull requests, plus a weekly schedule so a newly-published query catches latent issues on the
# unchanged tree. Uses the buildless analysis (build-mode: none), so no compile or restore runs here.
# Findings appear under the repository's Security > Code scanning alerts. Requires Actions billing and
# code-scanning to be enabled on the repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze / csharp
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the CodeQL results to code scanning
      actions: read # read Actions run metadata (needed on private repositories)
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:csharp"
