name: ci

# Enterprise CI gate for egl-util-csharp, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: dotnet8, preset: release }
          - { os: windows-2022, toolchain: dotnet8, preset: release }
          - { os: macos-14, toolchain: dotnet8, preset: release }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }

      - name: Build
        shell: bash
        run: dotnet build -c Release

      - name: Test
        shell: bash
        # Fail (not silently skip) the Testcontainers Redis integration tests on the Docker-capable leg,
        # so the only real-Redis coverage cannot vanish unnoticed after a container-start regression (a bad
        # image tag, a Testcontainers break) (#100). Docker is present on the ubuntu runner but not on the
        # windows/macos runners, where those tests still skip.
        env:
          REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}
        run: dotnet test -c Release

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Default shallow checkout: the consistency lint reads files only — the i18n check is
      # content-digest based (squash-merge-safe) and no check touches git history (#96).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert every project commits a packages.lock.json
        shell: bash
        run: |
          # Supply-chain guard (issue #23 follow-up / ADR-0014): RestoreLockedMode gates lockfile
          # *drift*, not *absence* — a project with no committed packages.lock.json restores green
          # under locked mode (NuGet silently generates one in obj/), leaving it ungated. Fail the
          # build if any tracked .csproj lives in a directory without a committed lockfile.
          # NUL-delimited so paths with non-ASCII/special characters are never C-quoted by git.
          missing=0
          while IFS= read -r -d '' csproj; do
            dir=$(dirname "$csproj")
            if ! git ls-files --error-unmatch "$dir/packages.lock.json" >/dev/null 2>&1; then
              echo "::error file=$csproj::Project has no committed packages.lock.json (RestorePackagesWithLockFile=true requires one; locked-mode CI cannot gate a project without it)"
              missing=1
            fi
          done < <(git ls-files -z '*.csproj')
          if [ "$missing" -ne 0 ]; then
            echo "Supply-chain check failed: every project must commit a packages.lock.json (regenerate with 'dotnet restore --force-evaluate')."
            exit 1
          fi
          echo "OK: every tracked .csproj has a committed packages.lock.json."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / format + analyzers + coverage
    runs-on: ubuntu-24.04
    # Bound the runner like the other jobs (build=30, consistency=15): a hung `dotnet test --collect`
    # or wedged restore would otherwise hold a runner for GitHub's 6-hour default and delay the
    # required-check feedback on a main push (#75).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }
      - run: dotnet format --verify-no-changes
      - run: dotnet build -warnaserror
      # Enforce the >=80% line-coverage bar (ADR-0010) via coverlet.msbuild — the previous
      # `--collect:"XPlat Code Coverage"` wrote a Cobertura file that nothing read (issue #24). The
      # test run fails if total line coverage drops below the threshold (ADR-0016).
      - run: dotnet test -c Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=80 /p:ThresholdType=line /p:ThresholdStat=total

  # ---------------------------------------------------------------------------
  # Exercise the pack of BOTH packages on every PR (#64, #38): run `dotnet pack` and assert (a) the core
  # It.D4np.Util nupkg bundles all three layer assemblies — so a regression in the
  # IncludeReferencedProjectsInPackage target fails CI instead of shipping silently in a patch — and
  # (b) the split boundary holds: the core declares NO MediatR/FluentValidation dependency, while the
  # opt-in It.D4np.Util.MediatR ships only its own assembly (the core layers arrive via the It.D4np.Util
  # dependency, never re-bundled) and depends on It.D4np.Util + MediatR + FluentValidation. This is the
  # authoritative package-level guarantee that the core stays free of both couplings. API-compatibility
  # validation (EnablePackageValidation + a baseline) is deferred to the 2.0 cut, since the current surface
  # already carries the accrued 2.0-breaking changes and would fail a 1.0.0 baseline.
  # ---------------------------------------------------------------------------
  package:
    name: package / pack + bundling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }
      - name: Pack both packages and assert bundling + split isolation
        shell: bash
        run: |
          dotnet pack src/main/csharp/it/d4np/util/Infrastructure/It.D4np.Util.Infrastructure.csproj -c Release -o ./artifacts
          dotnet pack src/main/csharp/it/d4np/util/MediatR/It.D4np.Util.MediatR.csproj -c Release -o ./artifacts

          # The `[0-9]` after the prefix isolates the core It.D4np.Util.<version>.nupkg from It.D4np.Util.MediatR.<version>.nupkg.
          core=$(find ./artifacts -name 'It.D4np.Util.[0-9]*.nupkg' | head -1)
          mediatr=$(find ./artifacts -name 'It.D4np.Util.MediatR.*.nupkg' | head -1)
          if [ -z "$core" ]; then echo "::error::no core It.D4np.Util .nupkg produced"; exit 1; fi
          if [ -z "$mediatr" ]; then echo "::error::no It.D4np.Util.MediatR .nupkg produced"; exit 1; fi

          # (a) The core package bundles all three layer assemblies (#64).
          for dll in It.D4np.Util.Domain.dll It.D4np.Util.Application.dll It.D4np.Util.Infrastructure.dll; do
            if ! unzip -l "$core" | grep -q "lib/net8.0/$dll"; then
              echo "::error::core nupkg is missing lib/net8.0/$dll — the bundling target dropped a layer (#64)"
              exit 1
            fi
          done

          # (b) The core package must declare NO MediatR/FluentValidation dependency (#38) — the exact
          # `id="..."` (with the closing quote) never matches id="It.D4np.Util.MediatR".
          core_nuspec=$(unzip -p "$core" '*.nuspec')
          for dep in 'id="MediatR"' 'id="FluentValidation"'; do
            if echo "$core_nuspec" | grep -q "$dep"; then
              echo "::error::core It.D4np.Util nuspec declares $dep — the MediatR/FluentValidation coupling must stay in It.D4np.Util.MediatR (#38)"
              exit 1
            fi
          done

          # The opt-in package ships only its own assembly; the core layers must NOT be re-bundled (they
          # arrive via the It.D4np.Util dependency).
          if ! unzip -l "$mediatr" | grep -q "lib/net8.0/It.D4np.Util.MediatR.dll"; then
            echo "::error::It.D4np.Util.MediatR nupkg is missing lib/net8.0/It.D4np.Util.MediatR.dll"
            exit 1
          fi
          for dll in It.D4np.Util.Domain.dll It.D4np.Util.Application.dll It.D4np.Util.Infrastructure.dll; do
            if unzip -l "$mediatr" | grep -q "lib/net8.0/$dll"; then
              echo "::error::It.D4np.Util.MediatR nupkg re-bundles $dll — it must depend on the It.D4np.Util package instead (#38)"
              exit 1
            fi
          done

          # ... and declares exactly the expected dependencies: the core package plus MediatR + FluentValidation.
          mediatr_nuspec=$(unzip -p "$mediatr" '*.nuspec')
          for dep in 'id="It.D4np.Util"' 'id="MediatR"' 'id="FluentValidation"'; do
            if ! echo "$mediatr_nuspec" | grep -q "$dep"; then
              echo "::error::It.D4np.Util.MediatR nuspec is missing dependency $dep (#38)"
              exit 1
            fi
          done
          echo "OK: core bundles all layers with no MediatR/FluentValidation dep; the opt-in package ships only its own assembly and depends on It.D4np.Util + MediatR + FluentValidation."
