# Dependabot for egl-util-csharp (generated by EADOS).
# Keeps GitHub Actions and language dependencies current. Each ecosystem opens a single
# GROUPED PR per run so concurrent single-dependency PRs can no longer race and silently
# revert one another at squash-merge. Dependabot proposes, the maintainer merges.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["ci"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels: ["build"]
    groups:
      nuget:
        patterns: ["*"]
